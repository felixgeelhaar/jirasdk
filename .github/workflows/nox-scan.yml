# Standalone nox security scan — mirrors the `security` job of the reusable
# felixgeelhaar/.github go-ci.yml, kept separate from ci.yml's job names
# (Test / Lint / Build / Dependency Go-version drift) and the CodeQL "Analyze"
# check.
#
# This is now the only security scanner in the repo: ci.yml's "Security Scan"
# job ran the discontinued VerdictSec under `|| true` and has been removed, so
# "Security (nox)" replaces it as the required status check on main.
#
# Pinned + sha256-verified nox 1.26.0, cosign for signed-plugin trust,
# source-to-sink taint SAST, SARIF -> GitHub code scanning, and a
# self-adjusting gate: report-only until a nox baseline exists (a baseline is
# committed at .nox/baseline.json, so this gate enforces net-new critical/high
# and stays green while known findings remain waived).
name: Nox Security Scan

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    # No paths-ignore here, deliberately. Lint, Build, Test and Security (nox)
    # are required status checks on main, so a filtered-out pull_request never
    # reports them: they sit as "Expected" forever and the PR can never be
    # merged. That silently blocked every documentation-only PR from #71 until
    # it surfaced releasing v1.9.0. The push trigger above keeps its filter,
    # where skipping costs nothing because the PR already verified the commits.
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Security (nox)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write   # nox annotate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Scanning is delegated to the SHA-pinned nox-hq/nox action, the same one
      # roady and every plugin repository use. It replaces the tarball download,
      # its sha256 verification, the cosign install, the plugin install and the
      # scan — each a local reimplementation of what the action already does,
      # and each a place where this repo could drift from the rest of the fleet.
      #
      # `nox install` inside the action reads plugins.required from .nox.yaml, so
      # nox/taint-analysis still runs. That capability arrived in nox 1.27.0
      # (nox-hq/nox#447); before it, adopting the action meant losing SAST.
      #
      # fail-on-degraded replaces grepping the scan output for "[degraded]": it
      # is the tool's own signal and covers OSV lookups and lockfile parses too.
      # Retried up to three times, because the nox-intelligence endpoint
      # intermittently times out its TLS handshake from GitHub runners. It
      # failed five times on 2026-09-11 between 08:14 and 09:42 UTC, each time
      # recovering within minutes, and each time costing a manual re-run of a
      # required check. Measured at the time: the endpoint served 40/40
      # handshakes from a runner and 25/25 concurrent from a workstation, so
      # this is a transient path problem rather than the service being
      # overloaded.
      #
      # Every attempt keeps fail-on-degraded true, so the guarantee is
      # unchanged: a source that is genuinely unreachable still fails the job,
      # just after three tries instead of one. The semantics are not relaxed;
      # only the patience is. "Verify a scan completed" below is what enforces
      # that, and it fails closed.
      #
      # Attempts 2 and 3 are skipped when the first succeeds, so a healthy run
      # costs nothing.
      - name: Scan
        id: scan1
        continue-on-error: true
        uses: nox-hq/nox@e6629b843b4403eb4db0c75a377e1b1edb2bc925 # v1.35.0
        with:
          path: .
          format: json,sarif
          output: nox-results
          fail-on-findings: 'false'
          fail-on-degraded: 'true'
          annotate: ${{ github.event_name == 'pull_request' }}

      - name: Back off before retry
        if: steps.scan1.outcome == 'failure'
        run: |
          echo "::warning::nox scan did not complete; retrying in 60s. See the [degraded] lines above."
          sleep 60

      - name: Scan (attempt 2)
        id: scan2
        if: steps.scan1.outcome == 'failure'
        continue-on-error: true
        uses: nox-hq/nox@e6629b843b4403eb4db0c75a377e1b1edb2bc925 # v1.35.0
        with:
          path: .
          format: json,sarif
          output: nox-results
          fail-on-findings: 'false'
          fail-on-degraded: 'true'
          annotate: 'false'

      - name: Back off before final retry
        if: steps.scan1.outcome == 'failure' && steps.scan2.outcome == 'failure'
        run: |
          echo "::warning::nox scan did not complete on the second attempt; retrying in 120s."
          sleep 120

      - name: Scan (attempt 3)
        id: scan3
        if: steps.scan1.outcome == 'failure' && steps.scan2.outcome == 'failure'
        continue-on-error: true
        uses: nox-hq/nox@e6629b843b4403eb4db0c75a377e1b1edb2bc925 # v1.35.0
        with:
          path: .
          format: json,sarif
          output: nox-results
          fail-on-findings: 'false'
          fail-on-degraded: 'true'
          annotate: 'false'

      # The step that preserves fail-on-degraded across the retries. A skipped
      # attempt has outcome "skipped", not "success", so this fails unless some
      # attempt actually completed — three degraded scans still fail the job.
      - name: Verify a scan completed
        if: always()
        run: |
          for o in "${{ steps.scan1.outcome }}" "${{ steps.scan2.outcome }}" "${{ steps.scan3.outcome }}"; do
            if [ "$o" = "success" ]; then
              echo "a scan completed without degradation"
              exit 0
            fi
          done
          echo "::error::No nox scan completed after 3 attempts. A scan that could not look is not a scan that found nothing — see the [degraded] lines above and meta.degradations in nox-results/findings.json."
          exit 1

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('nox-results/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: nox-results/results.sarif


      - name: Gate on net-new critical/high findings
        # Enforces unconditionally.
        #
        # This step used to be self-adjusting: report-only until at least one
        # finding was marked "baselined", so that adopting nox could not turn a
        # red build red on day one. That heuristic reads baseline entries as
        # proof adoption finished, and it is wrong for a repo that waives
        # findings with a `nox:ignore` directive at the site instead — waive
        # everything inline and the baselined count stays zero, so the gate
        # reports forever. A gate whose off-switch is "you cleaned up properly"
        # is worse than no gate.
        #
        # A finding counts as live only when it carries no status at all, so an
        # inline-suppressed finding is waived rather than fatal. Under the old
        # condition a suppressed critical would have failed the build, since
        # anything not literally "baselined" was treated as net-new.
        if: always() && hashFiles('nox-results/findings.json') != ''
        run: |
          f=nox-results/findings.json
          waived=$(jq '[.findings[]? | select(.Status=="baselined" or .Status=="suppressed")] | length' "$f" 2>/dev/null || echo 0)
          new=$(jq '[.findings[]? | select((.Severity=="critical" or .Severity=="high") and ((.Status // "") == ""))] | length' "$f" 2>/dev/null || echo 0)
          echo "net-new critical/high: $new (waived findings: $waived)"
          if [ "$new" -gt 0 ]; then
            echo "::error::Net-new critical/high findings. Remediate, or waive at the site with a nox:ignore directive stating why."
            jq '.findings[] | select((.Severity=="critical" or .Severity=="high") and ((.Status // "") == "")) | {severity:.Severity, rule:.RuleID, file:.Location.FilePath, line:.Location.StartLine}' "$f"
            exit 1
          fi

      - name: Upload nox artifacts
        if: always() && hashFiles('nox-results/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nox-results
          path: nox-results/
          retention-days: 7
