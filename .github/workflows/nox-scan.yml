# Standalone nox security scan — mirrors the `security` job of the reusable
# felixgeelhaar/.github go-ci.yml, kept separate from ci.yml's job names
# (Test / Lint / Build / Dependency Go-version drift) and the CodeQL "Analyze"
# check.
#
# This is now the only security scanner in the repo: ci.yml's "Security Scan"
# job ran the discontinued VerdictSec under `|| true` and has been removed, so
# "Security (nox)" replaces it as the required status check on main.
#
# Pinned + sha256-verified nox 1.26.0, cosign for signed-plugin trust,
# source-to-sink taint SAST, SARIF -> GitHub code scanning, and a
# self-adjusting gate: report-only until a nox baseline exists (a baseline is
# committed at .nox/baseline.json, so this gate enforces net-new critical/high
# and stays green while known findings remain waived).
name: Nox Security Scan

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Security (nox)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write   # nox annotate
    env:
      NOX_VERSION: "1.26.0"
      NOX_SHA256: "6879f8c7b523ebab9920d40919917b422bb952f9252fbadde9061cb37827793c"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install nox (pinned + sha256-verified binary)
        run: |
          curl -sL -o nox.tar.gz \
            "https://github.com/nox-hq/nox/releases/download/v${NOX_VERSION}/nox_${NOX_VERSION}_linux_amd64.tar.gz"
          echo "${NOX_SHA256}  nox.tar.gz" | sha256sum -c -
          tar xzf nox.tar.gz && sudo mv nox /usr/local/bin/ && nox version

      - name: Install cosign
        # nox verifies plugin signatures by shelling out to cosign. Without it,
        # signed plugins can't be promoted past "unverified" and install is
        # blocked under the default community-trust policy.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install taint-analysis plugin
        # nox owns code-level SAST: source-to-sink taint (SSRF, injection, path
        # traversal). The plugin is cosign-signed; with cosign present nox
        # promotes it to community trust and installs it (no bypass).
        #
        # #89 added `continue-on-error: true` here on the reasoning that a
        # plugin-registry 404 is not a security failure. The consequence was
        # that a 404 produced a green scan with no SAST coverage, reported
        # identically to a clean one — absence of coverage presented as absence
        # of findings. The install is asserted instead; re-run the job if the
        # registry is briefly unavailable.
        #
        # The 404 itself came from pinning @0.7.0; the pin is dropped and nox
        # bumped to 1.26.0, where the lookup resolves.
        #
        # Installing is also not enough on its own: nox runs only the plugins
        # listed under plugins.required in .nox.yaml.
        run: |
          nox plugin install nox/taint-analysis
          nox plugin list | grep -q '^nox/taint-analysis' || {
            echo "::error::taint-analysis plugin is not installed; this scan would have no SAST coverage."
            exit 1
          }

      - name: Scan
        run: nox scan . -format json,sarif -output nox-results || true

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('nox-results/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          sarif_file: nox-results/results.sarif

      - name: Annotate PR
        if: github.event_name == 'pull_request' && hashFiles('nox-results/findings.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nox annotate -input nox-results/findings.json || true

      - name: Gate on net-new critical/high findings
        # Enforces unconditionally.
        #
        # This step used to be self-adjusting: report-only until at least one
        # finding was marked "baselined", so that adopting nox could not turn a
        # red build red on day one. That heuristic reads baseline entries as
        # proof adoption finished, and it is wrong for a repo that waives
        # findings with a `nox:ignore` directive at the site instead — waive
        # everything inline and the baselined count stays zero, so the gate
        # reports forever. A gate whose off-switch is "you cleaned up properly"
        # is worse than no gate.
        #
        # A finding counts as live only when it carries no status at all, so an
        # inline-suppressed finding is waived rather than fatal. Under the old
        # condition a suppressed critical would have failed the build, since
        # anything not literally "baselined" was treated as net-new.
        if: always() && hashFiles('nox-results/findings.json') != ''
        run: |
          f=nox-results/findings.json
          waived=$(jq '[.findings[]? | select(.Status=="baselined" or .Status=="suppressed")] | length' "$f" 2>/dev/null || echo 0)
          new=$(jq '[.findings[]? | select((.Severity=="critical" or .Severity=="high") and ((.Status // "") == ""))] | length' "$f" 2>/dev/null || echo 0)
          echo "net-new critical/high: $new (waived findings: $waived)"
          if [ "$new" -gt 0 ]; then
            echo "::error::Net-new critical/high findings. Remediate, or waive at the site with a nox:ignore directive stating why."
            jq '.findings[] | select((.Severity=="critical" or .Severity=="high") and ((.Status // "") == "")) | {severity:.Severity, rule:.RuleID, file:.Location.FilePath, line:.Location.StartLine}' "$f"
            exit 1
          fi

      - name: Upload nox artifacts
        if: always() && hashFiles('nox-results/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nox-results
          path: nox-results/
          retention-days: 7
