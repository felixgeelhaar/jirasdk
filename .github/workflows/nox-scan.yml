# Standalone nox security scan — mirrors the `security` job of the reusable
# felixgeelhaar/.github go-ci.yml, kept separate from ci.yml's job names
# (Test / Lint / Build / Dependency Go-version drift) and the CodeQL "Analyze"
# check.
#
# This is now the only security scanner in the repo: ci.yml's "Security Scan"
# job ran the discontinued VerdictSec under `|| true` and has been removed, so
# "Security (nox)" replaces it as the required status check on main.
#
# Pinned + sha256-verified nox 1.26.0, cosign for signed-plugin trust,
# source-to-sink taint SAST, SARIF -> GitHub code scanning, and a
# self-adjusting gate: report-only until a nox baseline exists (a baseline is
# committed at .nox/baseline.json, so this gate enforces net-new critical/high
# and stays green while known findings remain waived).
name: Nox Security Scan

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Security (nox)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write   # nox annotate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Scanning is delegated to the SHA-pinned nox-hq/nox action, the same one
      # roady and every plugin repository use. It replaces the tarball download,
      # its sha256 verification, the cosign install, the plugin install and the
      # scan — each a local reimplementation of what the action already does,
      # and each a place where this repo could drift from the rest of the fleet.
      #
      # `nox install` inside the action reads plugins.required from .nox.yaml, so
      # nox/taint-analysis still runs. That capability arrived in nox 1.27.0
      # (nox-hq/nox#447); before it, adopting the action meant losing SAST.
      #
      # fail-on-degraded replaces grepping the scan output for "[degraded]": it
      # is the tool's own signal and covers OSV lookups and lockfile parses too.
      - name: Scan
        uses: nox-hq/nox@6aba53ab68346f12e980a1ba5ebf69a21ba7a0c0 # v1.27.0
        with:
          path: .
          format: json,sarif
          output: nox-results
          fail-on-findings: 'false'
          fail-on-degraded: 'true'
          annotate: ${{ github.event_name == 'pull_request' }}

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('nox-results/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: nox-results/results.sarif


      - name: Gate on net-new critical/high findings
        # Enforces unconditionally.
        #
        # This step used to be self-adjusting: report-only until at least one
        # finding was marked "baselined", so that adopting nox could not turn a
        # red build red on day one. That heuristic reads baseline entries as
        # proof adoption finished, and it is wrong for a repo that waives
        # findings with a `nox:ignore` directive at the site instead — waive
        # everything inline and the baselined count stays zero, so the gate
        # reports forever. A gate whose off-switch is "you cleaned up properly"
        # is worse than no gate.
        #
        # A finding counts as live only when it carries no status at all, so an
        # inline-suppressed finding is waived rather than fatal. Under the old
        # condition a suppressed critical would have failed the build, since
        # anything not literally "baselined" was treated as net-new.
        if: always() && hashFiles('nox-results/findings.json') != ''
        run: |
          f=nox-results/findings.json
          waived=$(jq '[.findings[]? | select(.Status=="baselined" or .Status=="suppressed")] | length' "$f" 2>/dev/null || echo 0)
          new=$(jq '[.findings[]? | select((.Severity=="critical" or .Severity=="high") and ((.Status // "") == ""))] | length' "$f" 2>/dev/null || echo 0)
          echo "net-new critical/high: $new (waived findings: $waived)"
          if [ "$new" -gt 0 ]; then
            echo "::error::Net-new critical/high findings. Remediate, or waive at the site with a nox:ignore directive stating why."
            jq '.findings[] | select((.Severity=="critical" or .Severity=="high") and ((.Status // "") == "")) | {severity:.Severity, rule:.RuleID, file:.Location.FilePath, line:.Location.StartLine}' "$f"
            exit 1
          fi

      - name: Upload nox artifacts
        if: always() && hashFiles('nox-results/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nox-results
          path: nox-results/
          retention-days: 7
