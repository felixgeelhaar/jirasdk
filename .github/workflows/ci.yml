name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ${{ github.event_name == 'pull_request' && fromJSON('["1.26"]') || fromJSON('["1.25", "1.26"]') }}

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run tests
      run: |
        go test -v -race -coverprofile=coverage.out -covermode=atomic \
          $(go list ./... | grep -v examples)

    - name: Install coverctl
      if: matrix.go-version == '1.26'
      run: go install go.klarlabs.de/coverctl@v1.17.0

    - name: Check coverage with coverctl
      if: matrix.go-version == '1.26'
      run: coverctl report --profile=coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    # Both versions come from .lint-toolchain, which scripts/lint.sh also reads,
    # so a local run cannot drift from this job. A linter version is a rule set:
    # a newer local golangci-lint can report FEWER problems than this job, which
    # is how a clean local run once still failed here.
    - name: Read pinned lint toolchain
      id: toolchain
      run: |
        set -euo pipefail
        # Parsed, not sourced: sourcing would execute .lint-toolchain in the
        # runner. Both values are validated before they reach a step output.
        read_pin() { sed -n "s/^$1=\([^#]*\).*/\1/p" .lint-toolchain | tr -d '[:space:]' | head -n1; }
        lint_version=$(read_pin GOLANGCI_LINT_VERSION)
        go_version=$(read_pin GO_VERSION)
        [[ "$lint_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad GOLANGCI_LINT_VERSION '$lint_version'"; exit 1; }
        [[ "$go_version" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::bad GO_VERSION '$go_version'"; exit 1; }
        echo "golangci-lint=${lint_version}" >> "$GITHUB_OUTPUT"
        echo "go=${go_version}" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: ${{ steps.toolchain.outputs.go }}
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: ${{ steps.toolchain.outputs.golangci-lint }}
        args: --timeout=5m

  # Security scanning lives in nox-scan.yml ("Security (nox)"), which runs on
  # the same triggers as this workflow. The job that used to sit here installed
  # VerdictSec from @latest and ran it under `|| true`: a scanner discontinued
  # upstream, pulled unpinned, whose findings could never fail the build. It
  # reported green whether it found nothing or never ran at all.

  dep-go-version-drift:
    name: Dependency Go-version drift
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: '1.26'
        cache: true

    - name: Check dependencies vs go.mod minimum
      run: bash scripts/check-dep-go-version.sh

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: '1.26'
        cache: true

    - name: Build
      run: go build -v $(go list ./... | grep -v examples)

    - name: Build working examples
      run: |
        go build -v ./examples/basic
        go build -v ./examples/advanced
        go build -v ./examples/environment
        go build -v ./examples/oauth2
        go build -v ./examples/customfields
        go build -v ./examples/attachments
