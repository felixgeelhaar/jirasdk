# warden — local git gate for jirasdk (Go). Sole hook manager; the persistent
# artifact is this file. pre-commit stays fast (format + vet); pre-push runs the
# same checks CI enforces (golangci-lint, race tests, build) so nothing leaves
# the machine that CI would reject. warden's native hooks live in .git/hooks and
# auto-fetch the binary if missing, so a fresh clone is gated with no toolchain
# beyond the Go SDK the repo already requires.
extends: ''
agent: auto
hooks:
  pre_commit: true
  pre_push: true
commands:
  # `gofmt -l` only PRINTS mis-formatted files - it exits 0 either way, and
  # warden gates on exit code. As `gofmt -l .` this step could never fail, so
  # the gate reported "passed" on a deliberately mis-formatted file. Wrapping
  # it in `test -z` turns a non-empty listing into a non-zero exit.
  # (Run `gofmt -w .` to fix what it reports.)
  gofmt: 'test -z "$(gofmt -l .)"'
  govet: go vet ./...
  # Via scripts/lint.sh, NOT a bare `golangci-lint`, which would resolve to
  # whatever is on PATH. A linter version is a rule set: a newer local binary
  # reports FEWER problems than CI, so a bare invocation passes locally and
  # fails the Lint job. The script reads .lint-toolchain — the same file the
  # Lint job reads — so this gate enforces exactly what CI enforces.
  golangcilint: scripts/lint.sh
  gotest: go test -race ./...
  gobuild: go build ./...
steps:
  pre_commit:
    - gofmt
    - govet
  pre_push:
    - rebase
    - gofmt
    - govet
    - golangcilint
    - gotest
    - gobuild
risk:
  diff_lines_high: 400
  files_touched_high: 15
pr:
  enabled: false
rules: []
